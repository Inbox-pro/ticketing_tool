<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="64" height="64" fill="none">
  <!-- Top green envelope flap -->
  <path d="M 50 10 L 88 44 L 12 44 Z" fill="#539E38" />

  <!-- Protruding white document -->
  <rect x="18" y="22" width="64" height="46" rx="2" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
  <line x1="26" y1="32" x2="48" y2="32" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" />
  <line x1="26" y1="40" x2="70" y2="40" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />
  <line x1="26" y1="48" x2="62" y2="48" stroke="#CBD5E1" stroke-width="2" stroke-linecap="round" />

  <!-- Left front fold (rust-orange) -->
  <path d="M 10 42 L 52 68 L 10 88 Z" fill="#E05A32" />

  <!-- Right front fold (cerulean blue) -->
  <path d="M 90 42 L 10 88 L 90 88 Z" fill="#0686C8" />

  <!-- Crisp highlight line -->
  <line x1="10" y1="88" x2="52" y2="68" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />
  <line x1="10" y1="42" x2="52" y2="68" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" />
</svg>
