<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 120" width="340" height="120" fill="none">
  <!-- Top green envelope flap -->
  <path d="M 50 16 L 95 56 L 5 56 Z" fill="#539E38" />

  <!-- Protruding white document -->
  <rect x="12" y="30" width="76" height="52" rx="3" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />
  <line x1="22" y1="42" x2="48" y2="42" stroke="#94A3B8" stroke-width="3" stroke-linecap="round" />
  <line x1="22" y1="52" x2="74" y2="52" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />
  <line x1="22" y1="62" x2="65" y2="62" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round" />

  <!-- Left front fold (rust-orange) -->
  <path d="M 2 54 L 52 84 L 2 106 Z" fill="#E05A32" />

  <!-- Right front fold (cerulean blue) -->
  <path d="M 98 54 L 2 106 L 98 106 Z" fill="#0686C8" />

  <!-- Clean separator lines -->
  <line x1="2" y1="106" x2="52" y2="84" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="2" y1="54" x2="52" y2="84" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" />

  <!-- Typography -->
  <text x="120" y="72" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" fill="#18181B" letter-spacing="-1">Inbox</text>
  
  <!-- Ticketing Tool Pill Badge -->
  <rect x="252" y="44" width="138" height="28" rx="14" fill="#1665D8" />
  <text x="321" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">TICKETING TOOL</text>
  
  <line x1="120" y1="83" x2="395" y2="83" stroke="#E05A32" stroke-width="3" stroke-linecap="round" />
  <text x="120" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#3F3F46" letter-spacing="0.2">Infotech Pvt.Ltd.</text>
</svg>
